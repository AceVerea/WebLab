<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Car Details - JDM Marketplace</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .detail-container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
      background: #1a1a1a;
      border-radius: 12px;
    }

    .back-btn {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 20px;
      background: #ff6b6b;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #ff5252;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: start;
    }

    .detail-image {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
    }

    .detail-image img {
      width: 100%;
      height: 400px;
      object-fit: cover;
    }

    .detail-info {
      color: white;
      text-align: left;
    }

    .detail-info h1 {
      font-size: 2.5em;
      margin: 0 0 10px 0;
      color: #ff6b6b;
    }

    .price {
      font-size: 1.8em;
      font-weight: bold;
      color: #4ecdc4;
      margin-bottom: 20px;
    }

    .specs {
      background: #0d0d0d;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .spec-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #333;
    }

    .spec-item:last-child {
      border-bottom: none;
    }

    .spec-label {
      color: #999;
      font-weight: bold;
    }

    .spec-value {
      color: #4ecdc4;
      font-weight: bold;
    }

    .description {
      font-size: 1.1em;
      line-height: 1.6;
      margin: 20px 0;
    }

    .action-btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1.1em;
      cursor: pointer;
      transition: background 0.3s;
    }

    .action-btn:hover {
      background: #ff5252;
    }

    .not-found {
      text-align: center;
      padding: 60px 20px;
      color: #ff6b6b;
    }

    @media (max-width: 768px) {
      .detail-grid {
        grid-template-columns: 1fr;
      }

      .detail-info h1 {
        font-size: 2em;
      }
    }
  </style>
</head>
<body>

<div class="detail-container">
  <a href="index.htm" class="back-btn">← Back to Home</a>
  <a href="market.htm" class="back-btn">📚 Back to Catalogue</a>
  
  <div id="carDetail"></div>
  <div id="notFound" class="not-found" style="display:none;">
    <h2>Car not found. <a href="market.htm">Return to marketplace</a></h2>
  </div>
</div>

<script src="script.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const car = getCarFromURL();
    const detailDiv = document.getElementById("carDetail");
    const notFoundDiv = document.getElementById("notFound");

    if (car) {
      detailDiv.innerHTML = `
        <div class="detail-grid">
          <div class="detail-image">
            <img src="${car.image}" alt="${car.name}">
          </div>
          <div class="detail-info">
            <h1>${car.name}</h1>
            <div class="price">${car.price}</div>
            
            <div class="specs">
              <div class="spec-item">
                <span class="spec-label">Year:</span>
                <span class="spec-value">${car.year}</span>
              </div>
              <div class="spec-item">
                <span class="spec-label">Engine:</span>
                <span class="spec-value">${car.engine}</span>
              </div>
              <div class="spec-item">
                <span class="spec-label">Horsepower:</span>
                <span class="spec-value">${car.horsepower}</span>
              </div>
              <div class="spec-item">
                <span class="spec-label">Weight:</span>
                <span class="spec-value">${car.weight}</span>
              </div>
            </div>

            <div class="description">${car.fullDesc}</div>
          </div>
        </div>
      `;
    } else {
      detailDiv.style.display = "none";
      notFoundDiv.style.display = "block";
    }
  });
</script>

</body>
</html>
